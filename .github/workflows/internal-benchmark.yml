name: Internal benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  internal-benchmark:
    if: github.repository == 'poolifier/poolifier-web-worker'
    runs-on:
      group: default
      labels: [self-hosted, internal-benchmark]
    env:
      BENCHER_PROJECT: poolifier-web-worker
      BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
      BENCHER_ADAPTER: json
      BENCHER_TESTBED: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - uses: bencherdev/bencher@b67e6668c5983e6c8a3db76796d250fe7b4faf41 # main
      - name: Run benchmark
        run: deno task benchmark:tinybench
      - name: Publish benchmark
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF" != refs/heads/master ]]; then
            args+=(--dry-run)
          fi
          bencher run \
          "${args[@]}" \
          --branch "$GITHUB_REF_NAME" \
          --threshold-measure latency \
          --threshold-test t_test \
          --threshold-max-sample-size 64 \
          --threshold-lower-boundary _ \
          --threshold-upper-boundary 0.99 \
          --threshold-measure throughput \
          --threshold-test t_test \
          --threshold-max-sample-size 64 \
          --threshold-lower-boundary 0.99 \
          --threshold-upper-boundary _ \
          --thresholds-reset \
          --file benchmark-report.json \
          --err
