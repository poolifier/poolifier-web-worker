name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.repository == 'poolifier/poolifier-web-worker'

    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}

    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

      - name: Dispatch CI for release pull request
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          pull_request=$(jq -r '.number' <<< "$RELEASE_PR")
          head_ref=$(jq -r '.headBranchName' <<< "$RELEASE_PR")
          base_ref=$(jq -r '.baseBranchName' <<< "$RELEASE_PR")

          gh workflow run ci.yml \
            --repo "${{ github.repository }}" \
            --ref "$head_ref" \
            --raw-field pull_request="$pull_request" \
            --raw-field head_ref="$head_ref" \
            --raw-field base_ref="$base_ref"

  build-release:
    needs: release-please
    runs-on: ubuntu-latest
    if: needs.release-please.outputs.release_created

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Format Check
        run: deno task format:check

      - name: Lint
        run: deno task lint

      - name: Tests & Coverage
        run: deno task test:coverage

      - name: Bundle
        run: deno task bundle

  publish-jsr:
    needs: build-release
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - name: Publish Release
        if: ${{ contains(github.ref_name, '-') == false }}
        run: deno publish

  publish-npm:
    needs: build-release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x

      - name: Bundle
        run: deno task bundle

      - name: Publish Release
        if: ${{ contains(github.ref_name, '-') == false }}
        run: cd dist && npm publish

      - name: Publish Release Candidate
        if: ${{ contains(github.ref_name, '-rc') == true }}
        run: cd dist && npm publish --tag next

      - name: Publish Beta Release
        if: ${{ contains(github.ref_name, '-beta') == true }}
        run: cd dist && npm publish --tag beta

      - name: Publish Alpha Release
        if: ${{ contains(github.ref_name, '-alpha') == true }}
        run: cd dist && npm publish --tag alpha
